description: mulif_model_delivery

target:
  service: sing
  name: GenAI-Shared-UKSouth2
  workspace_name: Singularity-GenAI-WS-UKSouth2
  resource_group: singularity-genai-gpu-uksouth2

env_defaults:
  service: sing
  PRIORITY: high
  NODES: 1
  GPUS: 1
  MEM: 80

environment:
  image: mulif/ifmul:amlt
  username: 44359f3e6e864ddba0853a221be97722
  registry: 44359f3e6e864ddba0853a221be97722.azurecr.io

storage:
  output:
    storage_account_name: vigstandard
    container_name: data
    mount_dir: /mnt/data

code:
  local_dir: ./

jobs:
  - name: mulif_model_delivery
    sku: ${NODES}x${MEM}G${GPUS}
    process_count_per_node: 1
    sla_tier: Standard
    priority: high
    mpi: false
    command:
      - set -ex
      - cd $$AMLT_CODE_DIR
      - pip install -e ".[gpu]"
      - set +x && [ -f .env ] && set -a && . ./.env && set +a || true && set -x
      - export AZURE_STORAGE_ROOT=$${AZURE_STORAGE_ROOT:-/mnt/data/v-yinyueqin/projects/mulif}
      - set +x && [ -n "$$HF_TOKEN" ] && huggingface-cli login --token $$HF_TOKEN || true && set -x
      # Pre-check: all 12 checkpoints (3 models x 4 steps) must exist before uploading anything
      - ls -d $$AZURE_STORAGE_ROOT/checkpoints/rebuttal_SaR_*/global_step_* || true
      - missing=0; for m in rebuttal_SaR_qwen7b rebuttal_SaR_qwen17b_random_sft rebuttal_SaR_qwen17b_bestN_sft; do for s in 100 200 300 400; do d=$$AZURE_STORAGE_ROOT/checkpoints/$$m/global_step_$$s/actor; if [ -d "$$d" ]; then echo "OK $$d"; else echo "MISSING $$d"; missing=1; fi; done; done; [ "$$missing" -eq 0 ] || { echo "checkpoint pre-check failed, aborting delivery"; exit 1; }
      - bash delivery.sh
    submit_args:
      env:
        DATASET_MOUNT_BLOCK_BASED_CACHE_ENABLED: True
        SHARED_MEMORY_PERCENT: 0.5
